        let activeLegend = null;

        // Fungsi untuk mengganti gambar secara langsung dari file lokal pengguna
        function handleImageUpload(event, legendKey) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                legendsData[legendKey].image = dataUrl;
                try {
                    const saved = JSON.parse(localStorage.getItem('nusantara_custom_images') || '{}');
                    saved[legendKey] = dataUrl;
                    localStorage.setItem('nusantara_custom_images', JSON.stringify(saved));
                } catch (err) {}
                
                if (activeLegend && activeLegend.id === legendKey) {
                    const storyImg = document.getElementById('active-story-img');
                    if (storyImg) storyImg.src = dataUrl;
                } else {
                    renderMenu();
                }
            };
            reader.readAsDataURL(file);
        }

        // Inisialisasi Web Audio API untuk Efek Suara (Synthesizer sederhana)
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioContextClass();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'click') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'correct') {
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(660, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.35);
                } else if (type === 'wrong') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(280, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {
                // Abaikan jika browser memblokir audio otomatis
            }
        }

        function toggleSpeech(text) {
            if ('speechSynthesis' in window) {
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    isSpeaking = false;
                    const icon = document.getElementById('tts-btn-icon');
                    const label = document.getElementById('tts-btn-text');
                    if (icon) icon.className = 'fas fa-volume-up';
                    if (label) label.innerText = 'Dengarkan Cerita';
                } else {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'id-ID';
                    utterance.rate = 0.95;
                    utterance.pitch = 1.0;
                    
                    utterance.onend = () => {
                        isSpeaking = false;
                        const icon = document.getElementById('tts-btn-icon');
                        const label = document.getElementById('tts-btn-text');
                        if (icon) icon.className = 'fas fa-volume-up';
                        if (label) label.innerText = 'Dengarkan Cerita';
                    };

                    window.speechSynthesis.speak(utterance);
                    isSpeaking = true;
                    const icon = document.getElementById('tts-btn-icon');
                    const label = document.getElementById('tts-btn-text');
                    if (icon) icon.className = 'fas fa-stop-circle';
                    if (label) label.innerText = 'Hentikan Suara';
                }
            } else {
                showModal("Maaf, peramban Anda belum mendukung fitur pembaca suara otomatis.");
            }
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
            }
        }

            for (const key in legendsData) {

                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
                            
                            <!-- Label Skor Selesai -->
                            <div class="absolute top-3 left-3 z-10">
                                ${badgeScore}

                            <!-- Label Kota -->

                                    <i class="fas fa-map-marker-alt mr-1.5 text-amber-400"></i> ${leg.region}

                        <!-- Tombol Ganti Foto Kustom -->
                        <label onclick="event.stopPropagation()" class="absolute top-36 right-3 z-20 cursor-pointer bg-slate-900/85 hover:bg-amber-500 hover:text-slate-950 text-amber-300 text-xs font-semibold px-3 py-1.5 rounded-full border border-amber-400/40 backdrop-blur shadow-lg transition-all flex items-center gap-1.5" title="Pakai file foto dari komputer/HP Anda">
                            <i class="fas fa-camera"></i> Ganti Foto

                        <!-- Area Teks -->

                            <div>

        function finishTypingImmediately() {
            clearInterval(textInterval);

        function checkAnswer(selectedIndex) {
            const qData = activeLegend.questions[currentQuestionIndex];
            const isCorrect = selectedIndex === qData.ans;
            const btns = document.querySelectorAll('.option-btn');
            
            btns.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                playSound('correct');
                score++;
                btns[selectedIndex].classList.add('bg-green-600/40', 'border-green-500');
                btns[selectedIndex].insertAdjacentHTML('beforeend', `<i class="fas fa-check-circle absolute right-4 top-1/2 -translate-y-1/2 text-2xl text-green-400"></i>`);
            } else {
                playSound('wrong');
                btns[selectedIndex].classList.add('bg-red-600/40', 'border-red-500');
                btns[selectedIndex].insertAdjacentHTML('beforeend', `<i class="fas fa-times-circle absolute right-4 top-1/2 -translate-y-1/2 text-2xl text-red-400"></i>`);
                btns[qData.ans].classList.add('bg-green-600/20', 'border-green-500');
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < activeLegend.questions.length) {
                    renderQuestion();
                } else {
                    renderResult();
                }
            }, 1400);
        }

        function renderResult() {
            playSound('click');
            const totalQ = activeLegend.questions.length;
            const percentage = Math.round((score / totalQ) * 100);
            
            // Simpan skor terbaik
            if (completedLegends[activeLegend.id] === undefined || score > completedLegends[activeLegend.id]) {
                completedLegends[activeLegend.id] = score;
            }

            let message = "";
            let icon = "";
            if (percentage === 100) {
                message = "Sempurna! Kamu memiliki insting analisis sastra yang luar biasa.";
                icon = "fa-crown text-yellow-400";
            } else if (percentage >= 60) {
                message = "Kerja bagus! Kamu sudah memahami sebagian besar unsur intrinsik legenda ini.";
                icon = "fa-star text-amber-300";
            } else {
                message = "Jangan menyerah! Mari kita baca kembali ceritanya dengan lebih teliti.";
                icon = "fa-book-open text-blue-300";
            }

            const html = `
                <div class="max-w-md mx-auto w-full text-center animate-fade-in">
                    <div class="glass-panel rounded-3xl p-8 shadow-2xl relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent z-0"></div>
                        
                        <div class="relative z-10">
                            <i class="fas ${icon} text-6xl mb-6 animate-bounce-slow"></i>
                            <h2 class="text-3xl font-serif font-bold text-white mb-2">Analisis Selesai</h2>
                            <p class="text-slate-300 mb-8">${message}</p>
                            
                            <div class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-yellow-500 mb-2">
                                ${score} <span class="text-2xl text-slate-400">/ ${totalQ}</span>
                            </div>
                            <p class="text-sm font-semibold tracking-wider text-slate-400 uppercase mb-8">Skor Akhir (${percentage}%)</p>
                            
                            <div class="flex flex-col gap-3">
                                <button onclick="startQuiz()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3.5 rounded-xl transition-colors shadow flex justify-center items-center gap-2">
                                    <i class="fas fa-redo"></i> Ulangi Kuis
                                </button>
                                <button onclick="renderMenu()" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-4 rounded-xl transition-colors shadow-lg flex justify-center items-center gap-2">
                                    <i class="fas fa-home"></i> Kembali ke Menu Utama
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('content-area').innerHTML = html;
        }

        function showModal(msg) {
            const modalHtml = `
                <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 animate-fade-in px-4">
                    <div class="bg-slate-800 border border-slate-600 rounded-xl p-6 max-w-sm w-full text-center shadow-2xl">
                        <i class="fas fa-exclamation-circle text-4xl text-amber-400 mb-4"></i>
                        <p class="text-white text-lg mb-6">${msg}</p>
                        <button onclick="document.getElementById('custom-modal').remove()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2 rounded-lg transition-colors">
                            Mengerti
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // Jalankan game saat halaman dimuat
        window.onload = () => {
            renderMenu();
        };
    </script>
</body>
</html>
